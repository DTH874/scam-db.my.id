<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Scamer DB · Dark Elite Registry</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #05070a;
            font-family: 'Space Grotesk', sans-serif;
            color: #eef2f5;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at 20% 30%, #0a0f1a 0%, #020408 100%);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(45deg, rgba(0,255,255,0.02) 0px, rgba(0,255,255,0.02) 2px, transparent 2px, transparent 8px);
            z-index: -1;
        }

        .glow-text {
            text-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
        }

        .container {
            max-width: 1300px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
            position: relative;
            z-index: 2;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding: 1rem 0 1.5rem;
            border-bottom: 1px solid rgba(0, 255, 255, 0.2);
            margin-bottom: 2.5rem;
            backdrop-filter: blur(4px);
        }

        .logo h1 {
            font-size: 2.3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #ffffff 0%, #00e0ff 40%, #7c3aed 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }

        .logo p {
            font-size: 0.7rem;
            color: #5f7f9e;
            letter-spacing: 2px;
            margin-top: 5px;
        }

        .admin-btn {
            background: rgba(10, 20, 30, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid #00ccff;
            padding: 10px 28px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #00e0ff;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 5px rgba(0, 204, 255, 0.3);
        }

        .admin-btn:hover {
            background: #00ccff20;
            border-color: #00ffff;
            box-shadow: 0 0 15px rgba(0, 204, 255, 0.6);
            color: white;
        }

        /* Search Card */
        .search-card {
            background: rgba(8, 12, 24, 0.6);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 2rem;
            border: 1px solid rgba(0, 255, 255, 0.25);
            box-shadow: 0 25px 45px -12px rgba(0,0,0,0.5), 0 0 0 1px rgba(0, 255, 255, 0.1);
            margin-bottom: 2rem;
            transition: all 0.3s;
        }

        .search-card:hover {
            border-color: rgba(0, 255, 255, 0.5);
            box-shadow: 0 30px 50px -15px rgba(0,0,0,0.7);
        }

        .search-card h2 {
            font-size: 1.6rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
            background: linear-gradient(135deg, #fff, #00ccff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .search-card .sub {
            color: #8aadcc;
            font-size: 0.85rem;
            margin-bottom: 1.8rem;
            border-left: 3px solid #00ccff;
            padding-left: 12px;
        }

        .search-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1.2rem;
            align-items: flex-start;
        }

        .search-input {
            flex: 3;
            min-width: 250px;
        }

        .search-input input {
            width: 100%;
            background: #0a101c;
            border: 1px solid #2a4a60;
            padding: 15px 22px;
            border-radius: 50px;
            font-size: 1rem;
            color: white;
            font-family: 'Space Grotesk', monospace;
            outline: none;
            transition: all 0.2s;
        }

        .search-input input:focus {
            border-color: #00ffff;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.4);
        }

        .turnstile-box {
            flex: 1;
            min-width: 180px;
        }

        .search-btn {
            background: linear-gradient(95deg, #0a1a2a, #021018);
            border: 1px solid #00ccff;
            padding: 15px 36px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 1rem;
            color: #00e0ff;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .search-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #2c5a70;
        }

        .search-btn:active:not(:disabled) {
            transform: scale(0.96);
        }

        /* Result Panel */
        .result-panel {
            background: rgba(6, 10, 18, 0.7);
            backdrop-filter: blur(12px);
            border-radius: 32px;
            border: 1px solid rgba(0, 200, 255, 0.2);
            padding: 1.8rem;
            min-height: 300px;
        }

        .record-card {
            background: linear-gradient(135deg, #0f1828, #0a101c);
            border-left: 5px solid #ff3366;
            border-radius: 24px;
            padding: 1.5rem;
            margin-bottom: 1.2rem;
            transition: all 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .record-card:hover {
            transform: translateX(5px);
            border-left-color: #ff6699;
        }

        .record-field {
            display: grid;
            grid-template-columns: 140px 1fr;
            gap: 12px;
            margin: 12px 0;
        }

        .field-label {
            font-weight: 700;
            color: #5bc0ff;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .field-value {
            word-break: break-word;
            color: #eef2ff;
        }

        .proof-img {
            max-width: 100%;
            max-height: 240px;
            border-radius: 16px;
            border: 1px solid #3a6e8a;
            transition: 0.2s;
        }

        .proof-img:hover {
            transform: scale(1.02);
        }

        .not-found {
            text-align: center;
            padding: 3rem;
            color: #6f9abb;
            font-style: italic;
        }

        /* Modal Premium */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.96);
            backdrop-filter: blur(20px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(145deg, #0c1424, #060a12);
            max-width: 550px;
            width: 90%;
            border-radius: 40px;
            padding: 2rem;
            border: 1px solid #00ccff;
            box-shadow: 0 0 40px rgba(0, 204, 255, 0.2);
            max-height: 85vh;
            overflow-y: auto;
        }

        .modal-content input, .modal-content textarea {
            width: 100%;
            background: #071020;
            border: 1px solid #2a6078;
            padding: 12px 20px;
            border-radius: 40px;
            color: white;
            margin-bottom: 1rem;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .modal-content input:focus, .modal-content textarea:focus {
            outline: none;
            border-color: #00ffff;
            box-shadow: 0 0 8px rgba(0, 255, 255, 0.3);
        }

        .g-recaptcha {
            margin: 1rem 0;
            display: flex;
            justify-content: center;
        }

        .btn-submit, .login-btn {
            background: linear-gradient(95deg, #c2412c, #8a2010);
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 50px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 0.5rem;
            font-size: 1rem;
            transition: 0.2s;
        }

        .login-btn {
            background: linear-gradient(95deg, #1e6a88, #0e3a50);
        }

        .btn-submit:hover, .login-btn:hover {
            filter: brightness(1.1);
            transform: scale(0.98);
        }

        .close-modal {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #8aaec0;
            transition: 0.2s;
        }

        .close-modal:hover {
            color: #ff5566;
        }

        hr {
            border-color: #2a6078;
            margin: 1rem 0;
        }

        .toast {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: #0a1a2a;
            border-left: 4px solid #00ccff;
            padding: 12px 24px;
            border-radius: 40px;
            z-index: 1100;
            backdrop-filter: blur(8px);
            font-size: 0.85rem;
            animation: fadeInUp 0.3s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 700px) {
            .record-field {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <h1>⟡ SCAMER DB ⟡</h1>
            <p>ELITE FRAUD BLACKLIST · ZERO TRUST</p>
        </div>
        <button class="admin-btn" id="openAdminBtn">🔐 ADMIN VAULT</button>
    </div>

    <div class="search-card">
        <h2>⛧ TRACE FRAGMENT ⛧</h2>
        <div class="sub">Masukkan nomor HP (62xxxx) atau nama pelaku ke dalam sistem</div>
        <div class="search-row">
            <div class="search-input">
                <input type="text" id="searchQuery" placeholder="contoh: 6281234567890 atau nama scamer" autocomplete="off">
            </div>
            <div class="turnstile-box">
                <div id="cfTurnstile" class="cf-turnstile" data-sitekey="0x4AAAAAADWGW6loSQy9qZqQ" data-callback="onTurnstileCallback"></div>
            </div>
            <button id="searchButton" class="search-btn" disabled>⌕ VALIDATE & SEARCH</button>
        </div>
    </div>

    <div id="resultArea" class="result-panel">
        <div class="not-found">⚡ Selesaikan verifikasi anti-bot untuk memulai pencarian</div>
    </div>
</div>

<div id="adminModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeModal">✕</span>
        <h2 style="margin-bottom: 0.5rem;">⛧ ADMIN ELITE ⛧</h2>
        <p style="font-size: 0.75rem; margin-bottom: 1.5rem; color:#7e9eb5;">Tambahkan entri scamer ke database pusat</p>
        
        <div id="loginSection">
            <input type="text" id="adminUser" placeholder="Username" autocomplete="off">
            <input type="password" id="adminPass" placeholder="Password" autocomplete="off">
            <div class="g-recaptcha" data-sitekey="6Le9GvwsAAAAAFXPJZN153eZovhhyj7RoD6EoteK" data-callback="onRecaptchaSuccess"></div>
            <button id="loginBtn" class="login-btn">LOGIN SECURE</button>
        </div>
        
        <div id="addFormSection" style="display: none;">
            <hr>
            <input type="text" id="inputPhone" placeholder="NOMOR HP (62xxxxx) *wajib">
            <input type="text" id="inputName" placeholder="Nama Scamer">
            <input type="text" id="inputAmount" placeholder="Nominal kerugian (Rp)">
            <textarea id="inputReason" rows="2" placeholder="Alasan / modus penipuan"></textarea>
            <input type="text" id="inputInfo" placeholder="Info lain (URL pastebin/pastefy)">
            <input type="text" id="inputProof" placeholder="Bukti URL gambar (WAJIB https://top4top.io/...)">
            <input type="date" id="inputDate">
            <button id="submitDataBtn" class="btn-submit">⚠️ ADD TO DATABASE ⚠️</button>
        </div>
    </div>
</div>

<script>
    // Konfigurasi (env akan dibaca melalui API, tidak hardcode)
    let turnstileToken = null;
    let recaptchaToken = null;
    let adminSession = false;
    
    window.onTurnstileCallback = function(token) {
        turnstileToken = token;
        document.getElementById("searchButton").disabled = false;
    };
    
    window.onRecaptchaSuccess = function(token) {
        recaptchaToken = token;
    };
    
    function showToast(msg, isError = false) {
        let toast = document.createElement('div');
        toast.className = 'toast';
        toast.style.borderLeftColor = isError ? '#ff4466' : '#00ccff';
        toast.innerText = msg;
        document.body.appendChild(toast);
        setTimeout(() => toast.remove(), 3000);
    }
    
    // Helper search
    async function performSearch() {
        if (!turnstileToken) {
            showToast("Selesaikan Cloudflare Turnstile!", true);
            return;
        }
        const query = document.getElementById("searchQuery").value.trim();
        if (!query) {
            showToast("Masukkan nomor atau nama", true);
            return;
        }
        
        // Panggil Supabase langsung (public read)
        const SUPABASE_URL = "{{supa_PROJECT_URL}}";
        const SUPABASE_ANON_KEY = "{{Supa_api_key}}";
        if (!SUPABASE_URL.includes("{{") && !SUPABASE_ANON_KEY.includes("{{")) {
            const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            const isNumber = /^[\d\s\+]+$/.test(query) || query.startsWith('62') || query.startsWith('0');
            let searchVal = query;
            if (isNumber) {
                let cleaned = query.replace(/\D/g, '');
                if (cleaned.startsWith('0')) cleaned = '62' + cleaned.substring(1);
                if (!cleaned.startsWith('62')) cleaned = '62' + cleaned;
                searchVal = cleaned;
            }
            let dbQuery = supabase.from("scammers").select("*");
            if (isNumber) dbQuery = dbQuery.eq("phone", searchVal);
            else dbQuery = dbQuery.ilike("name", `%${searchVal}%`);
            
            const { data, error } = await dbQuery;
            if (error) {
                showToast("Error DB: " + error.message, true);
                return;
            }
            if (!data || data.length === 0) {
                document.getElementById("resultArea").innerHTML = '<div class="not-found">⛔ TIDAK DITEMUKAN dalam database Scamer DB ⛔</div>';
            } else {
                let html = `<h3 style="margin-bottom:1rem;">🔎 DITEMUKAN ${data.length} ENTRI</h3>`;
                for (let rec of data) {
                    html += `
                    <div class="record-card">
                        <div class="record-field"><div class="field-label">📞 NOMOR HP</div><div class="field-value">${escapeHtml(rec.phone)}</div></div>
                        <div class="record-field"><div class="field-label">👤 NAMA</div><div class="field-value">${escapeHtml(rec.name || '—')}</div></div>
                        <div class="record-field"><div class="field-label">💰 NOMINAL</div><div class="field-value">${escapeHtml(rec.amount || '—')}</div></div>
                        <div class="record-field"><div class="field-label">⚠️ ALASAN</div><div class="field-value">${escapeHtml(rec.reason || '—')}</div></div>
                        <div class="record-field"><div class="field-label">📎 INFO LAIN</div><div class="field-value">${rec.info_link ? `<a href="${escapeHtml(rec.info_link)}" target="_blank" style="color:#5bc0ff">${escapeHtml(rec.info_link)}</a>` : '—'}</div></div>
                        <div class="record-field"><div class="field-label">🖼️ BUKTI</div><div class="field-value">${renderProof(rec.proof_url)}</div></div>
                        <div class="record-field"><div class="field-label">📅 TANGGAL</div><div class="field-value">${escapeHtml(rec.date_added || '—')}</div></div>
                    </div>`;
                }
                document.getElementById("resultArea").innerHTML = html;
            }
        } else {
            document.getElementById("resultArea").innerHTML = '<div class="not-found">⚠️ Database tidak siap. Set environment variables di Vercel.</div>';
        }
        // reset turnstile
        turnstileToken = null;
        document.getElementById("searchButton").disabled = true;
        if (window.turnstile) window.turnstile.reset();
    }
    
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    function renderProof(url) {
        if (!url) return '—';
        if (url.startsWith('https://top4top.io/')) {
            return `<img src="${escapeHtml(url)}" class="proof-img" onerror="this.style.display='none'" loading="lazy">`;
        }
        return `<span style="color:#ff8c66;">⛔ Hanya top4top.io yang diizinkan</span><br><span style="font-size:0.7rem;">${escapeHtml(url)}</span>`;
    }
    
    // Admin Login via API (secure)
    async function adminLogin() {
        const username = document.getElementById("adminUser").value;
        const password = document.getElementById("adminPass").value;
        if (!recaptchaToken) {
            showToast("Selesaikan reCAPTCHA!", true);
            return;
        }
        try {
            const res = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password, recaptchaToken })
            });
            const data = await res.json();
            if (data.success) {
                adminSession = true;
                document.getElementById("loginSection").style.display = "none";
                document.getElementById("addFormSection").style.display = "block";
                showToast("Login berhasil! Anda dapat menambah data.");
            } else {
                showToast("Login gagal: " + (data.error || "kredensial salah"), true);
                if (window.grecaptcha) window.grecaptcha.reset();
                recaptchaToken = null;
            }
        } catch(e) {
            showToast("Error koneksi ke server", true);
        }
    }
    
    // Insert data via API (secure)
    async function insertScammer() {
        if (!adminSession) {
            showToast("Anda harus login terlebih dahulu!", true);
            return;
        }
        let phone = document.getElementById("inputPhone").value.trim();
        if (!phone) { showToast("Nomor HP wajib diisi", true); return; }
        let cleaned = phone.replace(/\D/g, '');
        if (cleaned.startsWith('0')) cleaned = '62' + cleaned.substring(1);
        if (!cleaned.startsWith('62')) cleaned = '62' + cleaned;
        const dataPayload = {
            phone: cleaned,
            name: document.getElementById("inputName").value.trim() || null,
            amount: document.getElementById("inputAmount").value.trim() || null,
            reason: document.getElementById("inputReason").value.trim() || null,
            info_link: document.getElementById("inputInfo").value.trim() || null,
            proof_url: document.getElementById("inputProof").value.trim() || null,
            date_added: document.getElementById("inputDate").value || new Date().toISOString().slice(0,10)
        };
        if (dataPayload.proof_url && !dataPayload.proof_url.startsWith("https://top4top.io/")) {
            showToast("Bukti URL harus dari top4top.io", true);
            return;
        }
        try {
            const res = await fetch('/api/add-scammer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dataPayload)
            });
            const result = await res.json();
            if (result.success) {
                showToast("Data berhasil ditambahkan ke database!");
                document.getElementById("inputPhone").value = "";
                document.getElementById("inputName").value = "";
                document.getElementById("inputAmount").value = "";
                document.getElementById("inputReason").value = "";
                document.getElementById("inputInfo").value = "";
                document.getElementById("inputProof").value = "";
                document.getElementById("inputDate").value = "";
            } else {
                showToast("Gagal: " + (result.error || "Unknown error"), true);
            }
        } catch(e) {
            showToast("Error server", true);
        }
    }
    
    document.getElementById("searchButton").addEventListener("click", performSearch);
    document.getElementById("openAdminBtn").onclick = () => {
        document.getElementById("adminModal").style.display = "flex";
        if (window.grecaptcha) window.grecaptcha.reset();
        recaptchaToken = null;
    };
    document.getElementById("closeModal").onclick = () => document.getElementById("adminModal").style.display = "none";
    document.getElementById("loginBtn").addEventListener("click", adminLogin);
    document.getElementById("submitDataBtn").addEventListener("click", insertScammer);
    window.onclick = (e) => { if(e.target === document.getElementById("adminModal")) document.getElementById("adminModal").style.display = "none"; };
</script>
</body>
</html>
