<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>Scamer DB · Dark Elite Registry</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0c12;
            background-image: radial-gradient(circle at 25% 40%, #0f121b 0%, #05070a 100%);
            font-family: 'Inter', sans-serif;
            color: #eef2f5;
            min-height: 100vh;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 2rem 1.5rem;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
            margin-bottom: 2.5rem;
        }

        .logo h1 {
            font-size: 2.2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #ffffff 0%, #00d4ff 50%, #7c3aed 100%);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -1px;
        }

        .logo p {
            font-size: 0.7rem;
            color: #5f7f9e;
            letter-spacing: 2px;
            margin-top: 4px;
        }

        .admin-btn {
            background: rgba(20, 28, 38, 0.9);
            backdrop-filter: blur(8px);
            border: 1px solid #2c4c6c;
            padding: 10px 28px;
            border-radius: 60px;
            font-weight: 600;
            font-size: 0.85rem;
            color: #b8e1fc;
            cursor: pointer;
            transition: all 0.2s;
        }

        .admin-btn:hover {
            background: #1a3a4e;
            border-color: #00ccff;
            color: white;
        }

        /* Search Card */
        .search-card {
            background: rgba(8, 12, 20, 0.75);
            backdrop-filter: blur(16px);
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid rgba(0, 200, 255, 0.2);
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.6);
            margin-bottom: 2rem;
        }

        .search-card h2 {
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .search-card .sub {
            color: #7e9eb5;
            font-size: 0.85rem;
            margin-bottom: 1.5rem;
        }

        .search-row {
            display: flex;
            flex-wrap: wrap;
            gap: 1rem;
            align-items: flex-start;
        }

        .search-input {
            flex: 3;
            min-width: 240px;
        }

        .search-input input {
            width: 100%;
            background: #0c111a;
            border: 1px solid #2a3e50;
            padding: 14px 20px;
            border-radius: 60px;
            font-size: 1rem;
            color: white;
            font-family: 'Inter', monospace;
            outline: none;
        }

        .search-input input:focus {
            border-color: #00ccff;
            box-shadow: 0 0 8px rgba(0, 204, 255, 0.3);
        }

        .turnstile-box {
            flex: 1;
            min-width: 180px;
        }

        .search-btn {
            background: linear-gradient(95deg, #0f212e, #061218);
            border: 1px solid #2c6e8a;
            padding: 14px 32px;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1rem;
            color: white;
            cursor: pointer;
            transition: 0.2s;
        }

        .search-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .search-btn:active:not(:disabled) {
            transform: scale(0.97);
        }

        /* Result Panel */
        .result-panel {
            background: #080c14;
            border-radius: 24px;
            border: 1px solid #1e3342;
            padding: 1.5rem;
            min-height: 280px;
        }

        .record-card {
            background: #0f1622;
            border-left: 5px solid #e63946;
            border-radius: 20px;
            padding: 1.4rem;
            margin-bottom: 1.2rem;
        }

        .record-field {
            display: grid;
            grid-template-columns: 130px 1fr;
            gap: 12px;
            margin: 12px 0;
        }

        .field-label {
            font-weight: 700;
            color: #7ab8d4;
            font-size: 0.8rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .field-value {
            word-break: break-word;
            color: #e2e8f0;
        }

        .proof-img {
            max-width: 100%;
            max-height: 220px;
            border-radius: 12px;
            border: 1px solid #2c6e8a;
        }

        .not-found {
            text-align: center;
            padding: 3rem;
            color: #6f9abb;
        }

        /* Modal Admin */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(14px);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: #0c1320;
            max-width: 550px;
            width: 90%;
            border-radius: 32px;
            padding: 2rem;
            border: 1px solid #2c5a70;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content input, .modal-content textarea {
            width: 100%;
            background: #07101c;
            border: 1px solid #2a5068;
            padding: 12px 18px;
            border-radius: 40px;
            color: white;
            margin-bottom: 1rem;
            font-size: 0.9rem;
        }

        .modal-content textarea {
            border-radius: 20px;
            resize: vertical;
        }

        .g-recaptcha {
            margin: 1rem 0;
            display: flex;
            justify-content: center;
        }

        .btn-submit {
            background: #c2412c;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
            margin-top: 0.5rem;
        }

        .close-modal {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #8aaec0;
        }

        hr {
            border-color: #1e4055;
            margin: 1rem 0;
        }

        .login-btn {
            background: #1e5a77;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 40px;
            font-weight: bold;
            color: white;
            cursor: pointer;
        }

        @media (max-width: 700px) {
            .record-field {
                grid-template-columns: 1fr;
                gap: 6px;
            }
            .container {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <div class="logo">
            <h1>⟡ SCAMER DB ⟡</h1>
            <p>ELITE FRAUD BLACKLIST · ZERO TRUST NETWORK</p>
        </div>
        <button class="admin-btn" id="openAdminModalBtn">⛧ ADMIN ACCESS ⛧</button>
    </div>

    <!-- Search Card -->
    <div class="search-card">
        <h2>🔍 IDENTIFY FRAUDSTER</h2>
        <div class="sub">Masukkan nomor HP (format 62xxxx) atau nama pelaku</div>
        <div class="search-row">
            <div class="search-input">
                <input type="text" id="searchInput" placeholder="Contoh: 6281234567890 atau nama scamer" autocomplete="off">
            </div>
            <div class="turnstile-box">
                <div id="cfTurnstileContainer" class="cf-turnstile" data-sitekey="0x4AAAAAADWGW6loSQy9qZqQ" data-callback="onTurnstileSuccess"></div>
            </div>
            <button id="searchBtn" class="search-btn" disabled>⚡ VALIDATE & SEARCH</button>
        </div>
    </div>

    <!-- Result Area -->
    <div id="resultContainer" class="result-panel">
        <div class="not-found">⟡ Selesaikan verifikasi anti-bot untuk memulai pencarian ⟡</div>
    </div>
</div>

<!-- Modal Admin -->
<div id="adminModal" class="modal">
    <div class="modal-content">
        <span class="close-modal" id="closeModalBtn">&times;</span>
        <h2 style="margin-bottom: 0.5rem;">⛧ ADMIN ELITE PANEL ⛧</h2>
        <p style="font-size: 0.75rem; margin-bottom: 1.5rem; color:#7e9eb5;">Tambah data scamer ke registry</p>
        
        <div id="adminLoginSection">
            <input type="text" id="adminUsername" placeholder="Username" autocomplete="off">
            <input type="password" id="adminPassword" placeholder="Password" autocomplete="off">
            <div class="g-recaptcha" data-sitekey="6Le9GvwsAAAAAFXPJZN153eZovhhyj7RoD6EoteK" data-callback="onAdminRecaptchaSuccess"></div>
            <button id="doAdminLogin" class="login-btn">LOGIN AS ADMIN</button>
        </div>
        
        <div id="adminAddForm" style="display: none;">
            <hr>
            <input type="text" id="addPhone" placeholder="NOMOR HP (wajib format 62xxxxx)">
            <input type="text" id="addName" placeholder="Nama Scamer (opsional)">
            <input type="text" id="addAmount" placeholder="Nominal kerugian (contoh: Rp 50.000.000)">
            <textarea id="addReason" rows="2" placeholder="Alasan / modus penipuan"></textarea>
            <input type="text" id="addInfo" placeholder="Info lain (URL pastebin / pastefy)">
            <input type="text" id="addProof" placeholder="Bukti URL gambar (WAJIB https://top4top.io/...)">
            <input type="date" id="addDate">
            <button id="submitRecordBtn" class="btn-submit">⚠️ TAMBAH KE DATABASE ⚠️</button>
        </div>
    </div>
</div>

<script>
    // ============================================================
    // AMBIL ENVIRONMENT VARIABLES (VERCEL)
    // Nama variable TIDAK DIUBAH sesuai permintaan
    // ============================================================
    const SUPABASE_URL = "{{supa_PROJECT_URL}}";
    const SUPABASE_ANON_KEY = "{{Supa_api_key}}";
    const ADMIN_USER = "{{Admin_uSername}}";
    const ADMIN_PASS = "{{Admin_pasword}}";
    const RECAPTCHA_SECRET = "{{reCAPTCHA_secreatkey}}";
    const CF_TURNSTILE_SITEKEY = "0x4AAAAAADWGW6loSQy9qZqQ";
    
    // Fallback untuk local dev / jika env belum terisi
    const finalSupabaseUrl = SUPABASE_URL.includes("{{") ? "https://your-project.supabase.co" : SUPABASE_URL;
    const finalSupabaseKey = SUPABASE_ANON_KEY.includes("{{") ? "your-anon-key" : SUPABASE_ANON_KEY;
    const finalAdminUser = ADMIN_USER.includes("{{") ? "admin_elite" : ADMIN_USER;
    const finalAdminPass = ADMIN_PASS.includes("{{") ? "Sc4m3rDB2025!" : ADMIN_PASS;
    
    // Inisialisasi Supabase
    let supabaseClient = null;
    if (finalSupabaseUrl !== "https://your-project.supabase.co" && finalSupabaseKey !== "your-anon-key") {
        supabaseClient = window.supabase.createClient(finalSupabaseUrl, finalSupabaseKey);
    } else {
        console.warn("⚠️ Supabase credentials belum diisi di environment Vercel!");
        // Mock fallback agar tidak error
        supabaseClient = {
            from: () => ({ select: () => Promise.resolve({ data: [], error: null }), insert: () => Promise.resolve({ error: null }) }),
            rpc: () => Promise.resolve({ data: { success: true }, error: null })
        };
    }
    
    // State
    let turnstileToken = null;
    let adminRecaptchaToken = null;
    let isAdminLoggedIn = false;
    
    // Cloudflare Turnstile callback
    window.onTurnstileSuccess = function(token) {
        turnstileToken = token;
        document.getElementById("searchBtn").disabled = false;
    };
    
    // Admin reCAPTCHA callback
    window.onAdminRecaptchaSuccess = function(token) {
        adminRecaptchaToken = token;
    };
    
    // Helper sanitize nomor HP ke format 62xxxx
    function sanitizePhoneNumber(raw) {
        let cleaned = raw.replace(/\D/g, '');
        if (cleaned.startsWith('0')) cleaned = '62' + cleaned.substring(1);
        if (!cleaned.startsWith('62')) cleaned = '62' + cleaned;
        return cleaned;
    }
    
    // Anti XSS escape
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }
    
    // Render proof URL (hanya top4top.io yang diizinkan)
    function renderProof(url) {
        if (!url) return '—';
        if (url.startsWith('https://top4top.io/')) {
            return `<img src="${escapeHtml(url)}" class="proof-img" onerror="this.style.display='none'" loading="lazy">`;
        } else {
            return `<span style="color:#ff8c66;">⛔ Domain tidak diwhitelist! Hanya top4top.io yang diperbolehkan.</span><br><span style="font-size:0.7rem;">${escapeHtml(url)}</span>`;
        }
    }
    
    // ======================== FUNGSI SEARCH ========================
    async function performSearch() {
        if (!turnstileToken) {
            alert("⚠️ Selesaikan verifikasi Cloudflare Turnstile terlebih dahulu!");
            return;
        }
        
        const rawQuery = document.getElementById("searchInput").value.trim();
        if (rawQuery === "") {
            document.getElementById("resultContainer").innerHTML = '<div class="not-found">Masukkan nomor HP atau nama scamer</div>';
            return;
        }
        
        // Deteksi apakah input berupa nomor atau nama
        const isNumber = /^[\d\s\+]+$/.test(rawQuery) || rawQuery.startsWith('62') || rawQuery.startsWith('0');
        let searchValue = rawQuery;
        
        if (isNumber) {
            searchValue = sanitizePhoneNumber(rawQuery);
        }
        
        // Query ke Supabase table "scammers"
        let query = supabaseClient.from("scammers").select("*");
        if (isNumber) {
            query = query.eq("phone", searchValue);
        } else {
            query = query.ilike("name", `%${searchValue}%`);
        }
        
        const { data, error } = await query;
        
        if (error) {
            document.getElementById("resultContainer").innerHTML = `<div class="not-found">❌ Database error: ${escapeHtml(error.message)}</div>`;
            return;
        }
        
        if (!data || data.length === 0) {
            document.getElementById("resultContainer").innerHTML = '<div class="not-found">⛔ TIDAK DITEMUKAN dalam database Scamer DB ⛔</div>';
            // Reset turnstile untuk keamanan
            turnstileToken = null;
            document.getElementById("searchBtn").disabled = true;
            if (window.turnstile) window.turnstile.reset();
            return;
        }
        
        // Tampilkan hasil
        let html = `<h3 style="margin-bottom:1rem;">🔎 Ditemukan ${data.length} entri scamer</h3>`;
        for (const rec of data) {
            html += `
            <div class="record-card">
                <div class="record-field">
                    <div class="field-label">📞 NOMOR HP</div>
                    <div class="field-value">${escapeHtml(rec.phone)}</div>
                </div>
                <div class="record-field">
                    <div class="field-label">👤 NAMA</div>
                    <div class="field-value">${escapeHtml(rec.name || '—')}</div>
                </div>
                <div class="record-field">
                    <div class="field-label">💰 NOMINAL</div>
                    <div class="field-value">${escapeHtml(rec.amount || '—')}</div>
                </div>
                <div class="record-field">
                    <div class="field-label">⚠️ ALASAN</div>
                    <div class="field-value">${escapeHtml(rec.reason || '—')}</div>
                </div>
                <div class="record-field">
                    <div class="field-label">📎 INFO LAIN</div>
                    <div class="field-value">${rec.info_link ? `<a href="${escapeHtml(rec.info_link)}" target="_blank" rel="noopener noreferrer" style="color:#5dade2">${escapeHtml(rec.info_link)}</a>` : '—'}</div>
                </div>
                <div class="record-field">
                    <div class="field-label">🖼️ BUKTI</div>
                    <div class="field-value">${renderProof(rec.proof_url)}</div>
                </div>
                <div class="record-field">
                    <div class="field-label">📅 TANGGAL</div>
                    <div class="field-value">${escapeHtml(rec.date_added || '—')}</div>
                </div>
            </div>
            `;
        }
        document.getElementById("resultContainer").innerHTML = html;
        
        // Reset turnstile setelah search selesai (anti brute force)
        turnstileToken = null;
        document.getElementById("searchBtn").disabled = true;
        if (window.turnstile) window.turnstile.reset();
    }
    
    // ======================== ADMIN LOGIN ========================
    async function adminLogin() {
        const username = document.getElementById("adminUsername").value;
        const password = document.getElementById("adminPassword").value;
        
        if (!adminRecaptchaToken) {
            alert("❌ Selesaikan reCAPTCHA terlebih dahulu!");
            return;
        }
        
        // Verifikasi credential dari environment
        if (username === finalAdminUser && password === finalAdminPass) {
            isAdminLoggedIn = true;
            document.getElementById("adminLoginSection").style.display = "none";
            document.getElementById("adminAddForm").style.display = "block";
            alert("✅ Login berhasil! Anda sekarang dapat menambahkan data scamer.");
        } else {
            alert("❌ Username atau password salah!");
            if (window.grecaptcha) window.grecaptcha.reset();
            adminRecaptchaToken = null;
        }
    }
    
    // ======================== INSERT DATA (via RPC untuk keamanan) ========================
    async function insertScammerData() {
        if (!isAdminLoggedIn) {
            alert("Anda harus login sebagai admin terlebih dahulu!");
            return;
        }
        
        let phoneRaw = document.getElementById("addPhone").value.trim();
        if (!phoneRaw) {
            alert("Nomor HP wajib diisi!");
            return;
        }
        
        const phone = sanitizePhoneNumber(phoneRaw);
        const name = document.getElementById("addName").value.trim() || null;
        const amount = document.getElementById("addAmount").value.trim() || null;
        const reason = document.getElementById("addReason").value.trim() || null;
        let infoLink = document.getElementById("addInfo").value.trim() || null;
        let proofUrl = document.getElementById("addProof").value.trim() || null;
        const dateVal = document.getElementById("addDate").value || new Date().toISOString().slice(0,10);
        
        // Validasi proof URL hanya top4top.io
        if (proofUrl && !proofUrl.startsWith("https://top4top.io/")) {
            alert("❌ BUKTI URL hanya diperbolehkan dari domain https://top4top.io/ untuk keamanan!");
            return;
        }
        
        // Gunakan RPC insert_scammer jika tersedia, fallback ke insert biasa
        try {
            const { data, error } = await supabaseClient.rpc('insert_scammer', {
                p_phone: phone,
                p_name: name,
                p_amount: amount,
                p_reason: reason,
                p_info_link: infoLink,
                p_proof_url: proofUrl,
                p_date_added: dateVal
            });
            
            if (error) throw error;
            
            if (data && data.success === false) {
                alert("Error: " + data.error);
            } else {
                alert("✅ Data scamer berhasil ditambahkan ke database!");
                // Reset form
                document.getElementById("addPhone").value = "";
                document.getElementById("addName").value = "";
                document.getElementById("addAmount").value = "";
                document.getElementById("addReason").value = "";
                document.getElementById("addInfo").value = "";
                document.getElementById("addProof").value = "";
                document.getElementById("addDate").value = "";
            }
        } catch (err) {
            // Fallback insert langsung jika RPC belum dibuat
            const { error } = await supabaseClient.from("scammers").insert([{
                phone: phone,
                name: name,
                amount: amount,
                reason: reason,
                info_link: infoLink,
                proof_url: proofUrl,
                date_added: dateVal
            }]);
            
            if (error) {
                alert("Gagal menyimpan: " + error.message);
            } else {
                alert("✅ Data scamer berhasil ditambahkan!");
                document.getElementById("addPhone").value = "";
                document.getElementById("addName").value = "";
                document.getElementById("addAmount").value = "";
                document.getElementById("addReason").value = "";
                document.getElementById("addInfo").value = "";
                document.getElementById("addProof").value = "";
                document.getElementById("addDate").value = "";
            }
        }
    }
    
    // ======================== EVENT LISTENERS ========================
    document.getElementById("searchBtn").addEventListener("click", performSearch);
    document.getElementById("openAdminModalBtn").addEventListener("click", () => {
        document.getElementById("adminModal").style.display = "flex";
        if (window.grecaptcha) window.grecaptcha.reset();
        adminRecaptchaToken = null;
    });
    document.getElementById("closeModalBtn").addEventListener("click", () => {
        document.getElementById("adminModal").style.display = "none";
    });
    document.getElementById("doAdminLogin").addEventListener("click", adminLogin);
    document.getElementById("submitRecordBtn").addEventListener("click", insertScammerData);
    
    // Tutup modal jika klik di luar
    window.onclick = function(e) {
        if (e.target === document.getElementById("adminModal")) {
            document.getElementById("adminModal").style.display = "none";
        }
    };
    
    console.log("Scamer DB Elite · Anti XSS · Anti Bot · Turnstile + reCAPTCHA aktif");
    console.log("Environment variables loaded from Vercel");
</script>
</body>
</html>
