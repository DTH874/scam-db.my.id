<!DOCTYPE html>
<html lang="id">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SCAMMER DB</title>

<script
    src="https://challenges.cloudflare.com/turnstile/v0/api.js"
    async
    defer
></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#0f172a;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.main{
    width:100%;
    max-width:900px;
    background:#111827;
    border:1px solid #1f2937;
    border-radius:15px;
    padding:25px;
}

.title{
    font-size:32px;
    margin-bottom:20px;
    font-weight:bold;
}

.searchBox{
    display:flex;
    gap:10px;
}

input{
    width:100%;
    padding:15px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#1f2937;
    color:white;
    font-size:15px;
}

button{
    min-width:130px;
    padding:15px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover{
    opacity:.9;
}

button:disabled{
    opacity:.5;
    cursor:not-allowed;
}

.card{
    margin-top:20px;
    background:#1f2937;
    border-radius:12px;
    padding:20px;
    line-height:1.7;
    overflow-wrap:break-word;
}

img{
    width:100%;
    max-width:300px;
    border-radius:10px;
    margin-top:10px;
}

a{
    color:#60a5fa;
    text-decoration:none;
}

.watermark{
    margin-top:25px;
    opacity:.5;
    text-align:center;
}

#result{
    margin-top:20px;
}

.loading{
    opacity:.7;
}

</style>

</head>
<body>

<div class="main">

    <div class="title">
        SCAMMER DB
    </div>

    <div class="searchBox">

        <input
            type="text"
            id="search"
            placeholder="628xxxx atau nama"
            maxlength="100"
            autocomplete="off"
        >

        <button
            id="searchBtn"
            onclick="searchData()"
        >
            SEARCH
        </button>

    </div>

    <br>

    <!-- ============= CLOUDFLARE TURNSTILE ============= -->

    <div
        class="cf-turnstile"
        data-sitekey="0x4AAAAAADWGW6loSQy9qZqQ"
    ></div>

    <div id="result"></div>

    <div class="watermark">
        BY POLOSS
    </div>

</div>

<script>

/*
# ============= CLEAN INPUT =============
*/

function cleanInput(value){

    return String(value)
        .replace(/[<>"'`;(){}[\]\\]/g,"")
        .replace(/\s+/g," ")
        .trim();

}

/*
# ============= ESCAPE HTML =============
*/

function escapeHtml(text){

    return String(text)
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}

/*
# ============= SEARCH DATA =============
*/

async function searchData(){

    const result = document.getElementById("result");

    const button = document.getElementById("searchBtn");

    const search = cleanInput(
        document.getElementById("search").value
    );

    /*
    # ============= VALIDASI INPUT =============
    */

    if(!search){

        result.innerHTML = `
            <div class="card">
                Input kosong
            </div>
        `;

        return;

    }

    /*
    # ============= GET TURNSTILE TOKEN =============
    */

    const cloudflareToken = document.querySelector(
        'input[name="cf-turnstile-response"]'
    )?.value || "";

    /*
    # ============= VALIDASI TURNSTILE =============
    */

    if(!cloudflareToken){

        result.innerHTML = `
            <div class="card">
                Cloudflare Turnstile wajib
            </div>
        `;

        return;

    }

    /*
    # ============= LOADING =============
    */

    button.disabled = true;

    result.innerHTML = `
        <div class="card loading">
            Loading...
        </div>
    `;

    try{

        /*
        # ============= FETCH API =============
        */

        const response = await fetch(
            "/api/search",
            {
                method:"POST",

                headers:{
                    "Content-Type":"application/json"
                },

                body:JSON.stringify({
                    search,
                    cloudflareToken
                })
            }
        );

        /*
        # ============= RAW RESPONSE =============
        */

        const rawText = await response.text();

        let data = null;

        try{

            data = JSON.parse(rawText);

        }catch{

            result.innerHTML = `
                <div class="card">
                    API ERROR<br><br>
                    ${escapeHtml(rawText)}
                </div>
            `;

            return;

        }

        /*
        # ============= ERROR RESPONSE =============
        */

        if(!data.status){

            result.innerHTML = `
                <div class="card">
                    ${escapeHtml(data.message || "Unknown error")}
                </div>
            `;

            return;

        }

        /*
        # ============= DATA EMPTY =============
        */

        if(!Array.isArray(data.result) || data.result.length === 0){

            result.innerHTML = `
                <div class="card">
                    Data tidak ditemukan
                </div>
            `;

            return;

        }

        /*
        # ============= CLEAR RESULT =============
        */

        result.innerHTML = "";

        /*
        # ============= RENDER DATA =============
        */

        data.result.forEach(item => {

            const div = document.createElement("div");

            div.className = "card";

            const infoUrl =
                item.info_lain &&
                (
                    item.info_lain.startsWith("https://pastebin.com/")
                    ||
                    item.info_lain.startsWith("https://pastefy.app/")
                );

            const imageUrl =
                item.bukti &&
                item.bukti.startsWith("https://top4top.io/");

            div.innerHTML = `

                <b>Nomor HP:</b><br>
                ${escapeHtml(item.nomor_hp || "-")}

                <br><br>

                <b>Nama:</b><br>
                ${escapeHtml(item.nama || "-")}

                <br><br>

                <b>Nominal:</b><br>
                ${escapeHtml(item.nominal || "-")}

                <br><br>

                <b>Alasan:</b><br>
                ${escapeHtml(item.alasan || "-")}

                <br><br>

                <b>Info Lain:</b><br>

                ${
                    infoUrl
                    ? `
                        <a
                            href="${escapeHtml(item.info_lain)}"
                            target="_blank"
                            rel="noopener noreferrer"
                        >
                            OPEN LINK
                        </a>
                    `
                    : "-"
                }

                <br><br>

                <b>Bukti:</b><br>

                ${
                    imageUrl
                    ? `
                        <img
                            src="${escapeHtml(item.bukti)}"
                            loading="lazy"
                            referrerpolicy="no-referrer"
                        >
                    `
                    : "-"
                }

                <br><br>

                <b>Tanggal:</b><br>
                ${escapeHtml(item.tanggal || "-")}

            `;

            result.appendChild(div);

        });

    }catch(err){

        result.innerHTML = `
            <div class="card">
                ${escapeHtml(err.message)}
            </div>
        `;

    }finally{

        button.disabled = false;

        /*
        # ============= RESET TURNSTILE =============
        */

        try{

            turnstile.reset();

        }catch{}

    }

}

</script>

</body>
</html>
